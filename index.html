<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOLA 戰情室 - 血汗獎金精算系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Deep Slate */
            color: #e2e8f0;
        }
        /* 玻璃擬態質感 */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        /* 金色強調文字 (高級感) */
        .text-gold {
            color: #fbbf24;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.2);
        }
        /* 漸變字體 */
        .text-gradient {
            background: linear-gradient(to right, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* 滾動條美化 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        /* 警告動畫 */
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .warning-pulse {
            animation: pulse-red 2s infinite;
            border: 1px solid #ef4444;
            background-color: rgba(239, 68, 68, 0.1);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col gap-6">

    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div>
            <h1 class="text-3xl font-bold text-gradient tracking-wide">HOLA 戰情室</h1>
            <p class="text-slate-400 text-sm mt-1">血汗獎金精算系統 v1.0 | 只有數字不會騙人</p>
        </div>
        
        <div class="glass-panel p-4 rounded-xl flex flex-wrap items-center gap-4 w-full md:w-auto">
            <div class="flex items-center gap-2">
                <label class="text-sm text-slate-300">起始月</label>
                <input type="month" id="start-month" value="2026-09" class="bg-slate-800 border border-slate-600 text-white rounded px-3 py-1.5 focus:outline-none focus:border-amber-500">
            </div>
            <span class="text-slate-500">-</span>
            <div class="flex items-center gap-2">
                <label class="text-sm text-slate-300">迄止月</label>
                <input type="month" id="end-month" value="2026-09" class="bg-slate-800 border border-slate-600 text-white rounded px-3 py-1.5 focus:outline-none focus:border-amber-500">
            </div>
        </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="glass-panel rounded-2xl p-6 border-t-4 border-t-slate-500">
            <h3 class="text-slate-400 font-medium mb-2">當月累積業績 (未稅)</h3>
            <div class="flex items-end gap-3">
                <span id="total-performance" class="text-4xl font-bold text-white">$0</span>
                <span id="performance-status" class="text-sm text-red-400 mb-1">未達40萬門檻</span>
            </div>
        </div>
        
        <div class="glass-panel rounded-2xl p-6 border-t-4 border-t-blue-500">
            <h3 class="text-slate-400 font-medium mb-2">平均折扣率</h3>
            <div class="text-4xl font-bold text-white" id="avg-discount">0%</div>
            <p class="text-sm text-slate-400 mt-1">影響最終獎金乘數</p>
        </div>

        <div class="glass-panel rounded-2xl p-6 border-t-4 border-t-amber-500 relative overflow-hidden">
            <!-- 背景發光特效 -->
            <div class="absolute -right-10 -top-10 w-32 h-32 bg-amber-500 rounded-full mix-blend-screen filter blur-3xl opacity-20"></div>
            <h3 class="text-slate-400 font-medium mb-2">實領血汗獎金</h3>
            <div class="text-5xl font-bold text-gold" id="total-bonus">$0</div>
            <p class="text-sm text-slate-400 mt-1" id="bonus-formula-hint">計算公式套用中...</p>
        </div>
    </div>

    <div class="glass-panel rounded-2xl flex-1 overflow-hidden flex flex-col">
        <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-800/50">
            <h2 class="font-semibold text-lg flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                訂單明細
            </h2>
            <div class="text-sm text-slate-400">
                模擬今日日期: <span class="text-white">2026-09-09</span>
            </div>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse whitespace-nowrap">
                <thead>
                    <tr class="bg-slate-800/80 text-slate-300 text-sm">
                        <th class="p-4 font-medium">狀態</th>
                        <th class="p-4 font-medium">單號</th>
                        <th class="p-4 font-medium">顧客</th>
                        <th class="p-4 font-medium">出貨日</th>
                        <th class="p-4 font-medium">貨押日 (到倉)</th>
                        <th class="p-4 font-medium text-right">認列業績(未稅)</th>
                        <th class="p-4 font-medium text-right">折扣率</th>
                        <th class="p-4 font-medium text-right">分攤初估獎金</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-slate-700/50 text-sm">
                    <!-- 資料由 JS 動態渲染 -->
                </tbody>
            </table>
        </div>
        <div id="empty-state" class="hidden flex-col items-center justify-center p-12 text-slate-500">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mb-2 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
            </svg>
            <p>這段期間沒有任何資料，你可以去喝杯咖啡了。</p>
        </div>
    </div>

    <script>
        // 系統預設「今天」日期，用於觸發貨押日警告
        const SYSTEM_TODAY = new Date('2026-09-09');

        // 模擬資料 (部分為達標，部分為未排程以測試警告)
        const mockData = [
            { id: 'SO-2609-001', status: '已結案', customer: '陳大文', deliveryDate: '2026-09-10', stockDate: '2026-09-05', originalAmount: 210000, validPreTax: 200000, discountRate: 0.10 },
            { id: 'SO-2609-002', status: '已結案', customer: '林淑芬', deliveryDate: '2026-09-12', stockDate: '2026-09-10', originalAmount: 315000, validPreTax: 300000, discountRate: 0.05 },
            { id: 'SO-2609-003', status: '已結案', customer: '王建國', deliveryDate: '2026-09-15', stockDate: '2026-09-13', originalAmount: 420000, validPreTax: 400000, discountRate: 0.12 },
            // 這筆測試警告：貨押日接近今天(9/12 < 9/9+7天)，且未排程出貨
            { id: 'SO-2610-004', status: '未排程', customer: '張奧客', deliveryDate: '2026-10-20', stockDate: '2026-09-12', originalAmount: 157500, validPreTax: 150000, discountRate: 0.08 },
            { id: 'SO-2609-005', status: '已排程', customer: '李小明', deliveryDate: '2026-09-25', stockDate: '2026-09-20', originalAmount: 84000, validPreTax: 80000, discountRate: 0.00 },
            // 跨月單據
            { id: 'SO-2611-006', status: '已結案', customer: '趙總裁', deliveryDate: '2026-11-05', stockDate: '2026-10-28', originalAmount: 1050000, validPreTax: 1000000, discountRate: 0.15 }
        ];

        // 格式化新台幣
        const formatTWD = (num) => {
            return new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', maximumFractionDigits: 0 }).format(num);
        };

        // DOM 元素選取
        const startMonthInput = document.getElementById('start-month');
        const endMonthInput = document.getElementById('end-month');
        const tbody = document.getElementById('table-body');
        const emptyState = document.getElementById('empty-state');
        const totalPerfEl = document.getElementById('total-performance');
        const perfStatusEl = document.getElementById('performance-status');
        const avgDiscountEl = document.getElementById('avg-discount');
        const totalBonusEl = document.getElementById('total-bonus');
        const bonusHintEl = document.getElementById('bonus-formula-hint');

        // 計算累進分段獎金 (依據您提供的公式)
        function calculateTieredBonus(totalPreTax, avgDiscount) {
            let performance = totalPreTax;
            let factor = 1 - avgDiscount;
            let totalBonus = 0;

            if (performance < 400000) return 0;

            // 超過 200萬的部分 (4.0%)
            if (performance > 2000000) {
                totalBonus += (performance - 2000000) * factor * 0.040;
                performance = 2000000;
            }
            // 160萬 ~ 200萬 (3.5%)
            if (performance > 1600000) {
                totalBonus += (performance - 1600000) * factor * 0.035;
                performance = 1600000;
            }
            // 120萬 ~ 160萬 (3.0%)
            if (performance > 1200000) {
                totalBonus += (performance - 1200000) * factor * 0.030;
                performance = 1200000;
            }
            // 80萬 ~ 120萬 (2.5%)
            if (performance > 800000) {
                totalBonus += (performance - 800000) * factor * 0.025;
                performance = 800000;
            }
            // 40萬 ~ 80萬 (2.0%)
            if (performance >= 400000) {
                totalBonus += (performance - 400000) * factor * 0.020;
            }

            return Math.round(totalBonus);
        }

        function render() {
            const startStr = startMonthInput.value; // YYYY-MM
            const endStr = endMonthInput.value; // YYYY-MM

            // 1. 過濾符合日期的單據 (取出 YYYY-MM 做比較)
            const filteredData = mockData.filter(order => {
                const orderMonth = order.deliveryDate.substring(0, 7);
                return orderMonth >= startStr && orderMonth <= endStr;
            });

            // 2. 只有「已結案」的單據才能算獎金
            const validOrders = filteredData.filter(o => o.status === '已結案');
            
            let totalValidPreTax = 0;
            let totalDiscountAmount = 0;

            validOrders.forEach(o => {
                totalValidPreTax += o.validPreTax;
                totalDiscountAmount += (o.validPreTax * o.discountRate);
            });

            // 計算加權平均折扣率
            let avgDiscountRate = 0;
            if (totalValidPreTax > 0) {
                avgDiscountRate = totalDiscountAmount / totalValidPreTax;
            }

            // 3. 計算總獎金
            const finalBonus = calculateTieredBonus(totalValidPreTax, avgDiscountRate);

            // 更新 Dashboard
            totalPerfEl.textContent = formatTWD(totalValidPreTax);
            if (totalValidPreTax >= 400000) {
                perfStatusEl.textContent = '已達標！';
                perfStatusEl.className = 'text-sm text-green-400 mb-1 font-bold';
            } else {
                perfStatusEl.textContent = `差 ${formatTWD(400000 - totalValidPreTax)} 達門檻`;
                perfStatusEl.className = 'text-sm text-red-400 mb-1';
            }

            avgDiscountEl.textContent = (avgDiscountRate * 100).toFixed(1) + '%';
            totalBonusEl.textContent = formatTWD(finalBonus);
            
            let maxTier = "0%";
            if(totalValidPreTax >= 2000000) maxTier = "4.0%";
            else if(totalValidPreTax >= 1600000) maxTier = "3.5%";
            else if(totalValidPreTax >= 1200000) maxTier = "3.0%";
            else if(totalValidPreTax >= 800000) maxTier = "2.5%";
            else if(totalValidPreTax >= 400000) maxTier = "2.0%";
            bonusHintEl.textContent = `當前最高級距: ${maxTier}`;

            // 4. 渲染表格
            tbody.innerHTML = '';
            
            if (filteredData.length === 0) {
                tbody.parentElement.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                tbody.parentElement.classList.remove('hidden');
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');

                filteredData.forEach(order => {
                    // 計算單筆分攤獎金 (僅供參考，照業績比例分攤總獎金)
                    let rowBonus = 0;
                    if (order.status === '已結案' && totalValidPreTax > 0) {
                        rowBonus = Math.round((order.validPreTax / totalValidPreTax) * finalBonus);
                    }

                    // 檢查危險警告：貨押日距今 7 天內，且狀態不為已結案/已排程
                    const orderStockDate = new Date(order.stockDate);
                    const diffTime = orderStockDate - SYSTEM_TODAY;
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    
                    let isWarning = false;
                    if (diffDays >= 0 && diffDays <= 7 && (order.status === '未排程' || order.status === '未確定')) {
                        isWarning = true;
                    }

                    const tr = document.createElement('tr');
                    tr.className = `hover:bg-slate-700/30 transition-colors ${isWarning ? 'warning-pulse' : ''}`;
                    
                    // 狀態徽章樣式
                    let statusClass = 'bg-slate-700 text-slate-300';
                    if (order.status === '已結案') statusClass = 'bg-green-500/20 text-green-400 border border-green-500/30';
                    if (order.status === '已排程') statusClass = 'bg-blue-500/20 text-blue-400 border border-blue-500/30';
                    if (order.status === '未排程') statusClass = 'bg-orange-500/20 text-orange-400 border border-orange-500/30';

                    tr.innerHTML = `
                        <td class="p-4">
                            <span class="px-2.5 py-1 rounded-full text-xs font-medium ${statusClass}">
                                ${order.status}
                            </span>
                        </td>
                        <td class="p-4 font-mono text-slate-300">${order.id}</td>
                        <td class="p-4">${order.customer}</td>
                        <td class="p-4">${order.deliveryDate}</td>
                        <td class="p-4">
                            <div class="flex items-center gap-2">
                                ${order.stockDate}
                                ${isWarning ? '<span title="注意：貨物將於7天內抵達，但尚未排程送貨！" class="flex h-3 w-3 relative"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span></span>' : ''}
                            </div>
                        </td>
                        <td class="p-4 text-right ${order.status === '已結案' ? 'text-white font-medium' : 'text-slate-500 line-through'}">
                            ${formatTWD(order.validPreTax)}
                        </td>
                        <td class="p-4 text-right">${(order.discountRate * 100).toFixed(1)}%</td>
                        <td class="p-4 text-right font-medium ${rowBonus > 0 ? 'text-gold' : 'text-slate-500'}">
                            ${order.status === '已結案' ? formatTWD(rowBonus) : '-'}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        }

        startMonthInput.addEventListener('change', render);
        endMonthInput.addEventListener('change', render);

        // 初始化渲染
        render();

    </script>
</body>
</html>
